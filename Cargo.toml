[package]
name = "abo"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
maud = "0.27"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Reads every answer to init. tests/tty.rs presses its keys: run it after a bump.
rustyline = { version = "18.0.1", default-features = false }
deunicode = "1.6.2"

# Already built for rustyline; used directly for the key-by-key VAT method
# list, and by tests/tty.rs for a terminal to press keys on.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["term"] }
