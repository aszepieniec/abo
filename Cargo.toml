[package]
name = "abo"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
rust_decimal = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# task_local!: the author of a change, per request, for abo-web.
tokio = { version = "1", features = ["rt", "macros"] }
toml = "0.8"
# Reads every answer to init. tests/tty.rs presses its keys: run it after a bump.
rustyline = { version = "18.0.1", default-features = false }
deunicode = "1.6.2"
toml_edit = "0.22"
unicode-general-category = "1.1.0"

# Already built for rustyline; used directly for the key-by-key VAT method
# list, and by tests/tty.rs for a terminal to press keys on.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["term"] }

# The model's property tests (src/model/props.rs). The features add
# `arbitrary` impls for the wildest values a test draws.
[dev-dependencies]
proptest = "1"
test-strategy = "0.4"
proptest-arbitrary-interop = "0.1"
arbitrary = "1"
rust_decimal = { version = "1", features = ["rust-fuzz"] }
jiff = { version = "0.2", features = ["arbitrary"] }
